name: Deploy relay
# Updates your Cloudflare relay automatically whenever worker/worker.js changes,
# once the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are added.
on:
  push:
    paths: ["worker/worker.js", "wrangler.toml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Relay not deployed automatically: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable this."
            exit 0
          fi
          npx --yes wrangler@3.114.0 deploy
