name: Check cause list
on:
  schedule:
    - cron: "30 13 * * *"   # 7:00 pm IST — evening alert
    - cron: "0 16 * * *"    # 9:30 pm IST — late lists
    - cron: "30 1 * * *"    # 7:00 am IST — additional / supplementary lists
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: causelist, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Get previous results
        run: mkdir -p data && (git fetch -q --depth 1 origin data && git show FETCH_HEAD:vault.json > data/vault.json || true)
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: tools/requirements.txt }
      - run: pip install -r tools/requirements.txt
      - name: Find my cases
        working-directory: tools
        env:
          ADVOCATE_NAMES: ${{ secrets.ADVOCATE_NAMES }}
          VAULT_PASSPHRASE: ${{ secrets.VAULT_PASSPHRASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VAULT_PATH: ../data/vault.json
        run: python run.py
      - name: Save encrypted results to the data branch
        run: |
          mkdir -p /tmp/out && cp data/vault.json /tmp/out/ && cd /tmp/out
          git init -q -b data
          git config user.name "vakeel-diary-bot"; git config user.email "bot@users.noreply.github.com"
          git add vault.json && git commit -qm "Update $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
