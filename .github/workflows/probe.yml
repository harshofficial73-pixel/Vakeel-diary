name: Probe court sites
on:
  push:
    paths: [".github/workflows/probe.yml", "tools/probe_causelist.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python tools/probe_causelist.py
      - name: Save results to probe-results branch
        run: |
          cd out
          git init -q -b probe-results
          git config user.name "probe-bot"; git config user.email "probe@users.noreply.github.com"
          git add -A; git commit -qm "Probe $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-results
