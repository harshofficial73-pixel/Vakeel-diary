<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vakeel Diary</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vakeel Diary">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Light, single theme by design. App shell: white top bar, content column (max 820px), bottom tab bar.
   Home groups each day's cases by court, the way an advocate plans the day. */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --sunk:#F8F9FA; --ink:#111827; --ink2:#374151; --muted:#6B7280; --line:#E5E7EB; --line2:#D1D5DB;
  --brand:#1F3B63; --brand-ink:#FFFFFF; --brand-soft:#EEF2F7;
  --ok:#0B7A53; --ok-soft:#E4F4EC; --warn:#9A5800; --warn-soft:#FCF0DC; --bad:#B42318; --bad-soft:#FDECEA; --live:#1D5FD1; --live-soft:#E6EEFC;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px; --shadow:0 1px 2px rgba(14,26,43,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--brand)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.logo svg{width:28px;height:28px;flex:none}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);text-align:right}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.stale{background:var(--warn)}

main.wrap{padding-block:18px 120px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-h h1{font-size:24px;line-height:1.2;font-weight:700;margin:0;letter-spacing:-.015em}
.page-h .sub{color:var(--muted);font-size:13.5px}
h2.sec{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}

/* summary tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:500}
.tile .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .d{font-size:12px;color:var(--muted)}
.tile.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}

/* day + court groups */
.day{margin-top:26px}
.day-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.day-h .t{font-size:19px;font-weight:700;letter-spacing:-.01em}
.day-h .t small{font-size:13.5px;font-weight:500;color:var(--muted);margin-left:6px}
.court{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.court-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--sunk);border-bottom:1px solid var(--line);flex-wrap:wrap}
.court-h .n{font-weight:700;font-size:15px}
.court-h .j{font-size:12.5px;color:var(--muted)}
.court-h .tot{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:4px}
.court-h .tot b{font-weight:600;color:var(--ink2)}
.sec-h{display:flex;justify-content:space-between;gap:8px;padding:7px 14px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);border-top:1px solid var(--line);background:#FBFCFD}
.sec-h span{font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.court .sec-h:first-of-type{border-top:0}
.court-h .now{font-size:12.5px;font-weight:600;color:var(--live);background:var(--live-soft);padding:3px 9px;border-radius:99px;white-space:nowrap}
.court-h .now.off{color:var(--muted);background:transparent;border:1px solid var(--line)}
.item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}

.item:hover{background:var(--sunk)}
.sr{border:1px solid var(--line2);border-radius:8px;text-align:center;padding:4px 0 5px;line-height:1.1}
.sr small{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sr b{font-size:19px;font-variant-numeric:tabular-nums}
.sr.reached{border-color:var(--ok);background:var(--ok-soft)} .sr.reached b{color:var(--ok)}
.it-main{min-width:0;display:flex;flex-direction:column;gap:3px}
.cno{font:600 13.5px var(--mono);color:var(--brand);letter-spacing:-.01em}
.parties{font-weight:500;color:var(--ink);overflow-wrap:anywhere;font-size:14.5px}
.chev{color:var(--line2);align-self:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--brand-soft);color:var(--brand);max-width:100%;overflow-wrap:anywhere}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.live{background:var(--live-soft);color:var(--live)}
.chip.mute{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.empty{background:var(--surface);border:1px dashed var(--line2);border-radius:var(--r);padding:18px;color:var(--muted);font-size:14px}
.notice{border-radius:10px;padding:10px 12px;font-size:13.5px;background:var(--warn-soft);color:var(--warn)}
.notice.bad{background:var(--bad-soft);color:var(--bad)} .notice.ok{background:var(--ok-soft);color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;padding:8px 14px;min-height:40px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--sunk)} .btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)} .btn.primary:hover{filter:brightness(1.08)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px} .btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.55;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,textarea,select{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:9px;padding:10px 12px;min-height:44px;font-size:16px}
textarea{min-height:96px;resize:vertical;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.mono{font-family:var(--mono)}

/* lists */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.row:first-child{border-top:0} .row:hover{background:var(--sunk)}
.row .r{text-align:right;font-size:12.5px;color:var(--muted);white-space:nowrap}
.row .r b{display:block;color:var(--ink);font-size:13.5px}
.search{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line2);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input{flex:1;min-width:180px}

/* case page */
.case-top{display:flex;flex-direction:column;gap:6px}
.case-top .cno{font-size:15px}
.case-top h1{font-size:21px;line-height:1.3;margin:0;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.next{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--brand-soft);border:1px solid #D5E0EF;border-radius:var(--r);padding:14px}
.next .cal{background:var(--surface);border:1px solid #D5E0EF;border-radius:10px;text-align:center;padding:6px 10px;min-width:62px;line-height:1.1}
.next .cal small{display:block;font-size:11px;font-weight:600;color:var(--bad);text-transform:uppercase;letter-spacing:.06em}
.next .cal b{font-size:24px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:start;font-size:14px}
.tl li:first-child{border-top:0}
.tl .dt{font:500 12.5px var(--mono);color:var(--ink2);padding-top:1px}
.tl .what{min-width:0}
.tl .what b{font-weight:600}
.tl .future .dt{color:var(--brand)}

/* board */
.brow{display:grid;grid-template-columns:52px 60px minmax(0,1fr);gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow .ct{font-weight:700;font-size:16px;text-align:center}
.brow .sn{text-align:center;line-height:1.05} .brow .sn b{font-size:22px;font-variant-numeric:tabular-nums;color:var(--brand)} .brow .sn small{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.brow .d{min-width:0;font-size:13px} .brow .d .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .d .m{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow.mine{background:var(--live-soft)} .brow.off{color:var(--muted)} .brow.off .ct{color:var(--muted)}

/* roll sync */
.captcha{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.captcha img{height:54px;border-radius:8px;border:1px solid var(--line2);background:#fff}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.res{border-collapse:collapse;font-size:13px;width:100%;min-width:520px}
table.res th,table.res td{padding:8px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.res th{background:var(--sunk);font-weight:600;border-top:0}

/* ---- listing v2 ---- */
.court{border-radius:14px}
.court-h{display:block;padding:12px 16px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.court-h .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.court-h .n{font-size:17px;font-weight:700;letter-spacing:-.01em}
.court-h .j{font-size:13.5px;color:var(--ink2);margin-top:1px}
.court-h .tot{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12.5px;color:var(--muted);margin-top:6px}
.court-h .tot b{color:var(--ink2);font-weight:600}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 16px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--sunk);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec-h span{font-weight:500;letter-spacing:0;text-transform:none}
.court-h + .sec-h{border-top:0}
.item{display:grid;grid-template-columns:48px minmax(0,1fr) 16px;gap:12px;align-items:start;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.sec-h + .item{border-top:0}
.item:active,.item:hover{background:var(--sunk)}
.item .no{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;color:var(--ink);text-align:right}
.item .no small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.item .no.reached{color:var(--ok)}
.item .body{min-width:0}
.item .pt{font-size:15.5px;font-weight:600;line-height:1.35;color:var(--ink);overflow-wrap:anywhere}
.item .sub{font-size:13.5px;color:var(--ink2);margin-top:4px;line-height:1.45;overflow-wrap:anywhere}
.item .sub .mono{font-size:12.5px;font-weight:600;color:var(--brand)}
.item .flag{display:block;margin-top:6px;font-size:12.5px;font-weight:600;color:var(--ok)}
.item .flag.warn{color:var(--warn)}
.item .chev{color:var(--line2);padding-top:4px}
.listing{display:block}
@media (min-width:900px){ .listing{column-count:2;column-gap:16px} .listing .court{break-inside:avoid;display:inline-block;width:100%} }

/* ---- board v2: cards, nothing cut off ---- */
.bgrid{display:grid;grid-template-columns:1fr;gap:10px;align-items:start}
@media (min-width:640px){ .bgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (min-width:1024px){ .bgrid{grid-template-columns:repeat(3,minmax(0,1fr))} }
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.bcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bcard .ct{font-size:15px;font-weight:700}
.bcard .now{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.bcard .now b{font-size:26px;color:var(--brand);letter-spacing:0;margin-left:6px;font-variant-numeric:tabular-nums}
.bcard .case{font:600 13px var(--mono);color:var(--brand);overflow-wrap:anywhere}
.bcard .title{font-size:14px;color:var(--ink);line-height:1.4;overflow-wrap:anywhere}
.bcard .meta{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.bcard .mine{font-size:13px;font-weight:600;color:var(--live)}
.bcard.is-mine{border-color:var(--live);box-shadow:inset 0 0 0 1px var(--live)}
.bcard.off{background:transparent;border-style:dashed;padding:10px 14px}
.bcard.off .ct{color:var(--ink2)}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs button{flex:1;max-width:180px;background:none;border:0;color:var(--muted);font-size:12px;font-weight:600;padding:9px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs svg{width:23px;height:23px}
nav.tabs button[aria-current="true"]{color:var(--brand)}

/* lock */
.lock{max-width:420px;margin:7vh auto 0;display:flex;flex-direction:column;gap:18px}
.lock .mark{width:56px;height:56px}
.lock h1{font-size:26px;line-height:1.2;margin:0;letter-spacing:-.015em}
.lock p{margin:0;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(14,26,43,.2)}
.pdf-panel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:45;width:min(520px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:14px;box-shadow:0 12px 32px rgba(14,26,43,.18);display:flex;flex-direction:column;gap:10px}
.pdf-panel .pp-t{font-weight:600}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--brand);font-weight:600;background:none;border:0;padding:0;cursor:pointer;margin-bottom:12px;font-size:14.5px}
@media (min-width:700px){ .item{grid-template-columns:64px minmax(0,1fr) auto} main.wrap{padding-top:24px} }
@media (max-width:380px){ .tiles .tile .v{font-size:24px} .kv{grid-template-columns:1fr} .kv dt{margin-top:6px} }
@media (prefers-reduced-motion:no-preference){ .court,.card,.rows{animation:rise .18s ease-out both} @keyframes rise{from{transform:translateY(4px)}} }
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <div class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#173B6C"/><g fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7.5v16M11 23.5h10M8.5 11h15"/><path d="M8.5 11l-3 6.5h6zM23.5 11l-3 6.5h6z"/></g></svg>Vakeel Diary</div>
  <div class="sync" id="sync"></div>
</div></header>
<main class="wrap" id="view"></main>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>Listings</button>
  <button data-tab="cases"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h10l4 4v12H5z"/><path d="M15 4v4h4M8.5 12h7M8.5 15.5h7"/></svg>Cases</button>
  <button data-tab="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="12.5" rx="2"/><path d="M8 20.5h8M12 16.5v4M7 8.5h3M7 11.5h6"/></svg>Display board</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3.6 15H3.5a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10.2 4V3.5a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.1a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.4 1z"/></svg>More</button>
</nav>
<div id="toast" class="toast" hidden></div>
<div id="pdfPanel" class="pdf-panel" hidden></div>

<script>
(() => {
const REPO = "harshofficial73-pixel/Vakeel-diary";
const qs = new URLSearchParams(location.search);
const VAULT_URL = qs.get("vault") || `https://raw.githubusercontent.com/${REPO}/data/vault.json`;
const LS = k => { try { return localStorage.getItem("vd." + k); } catch (e) { return null; } };
const SET = (k, v) => { try { v == null ? localStorage.removeItem("vd." + k) : localStorage.setItem("vd." + k, v); } catch (e) {} };
const JGET = (k, d) => { try { return JSON.parse(LS(k)) ?? d; } catch (e) { return d; } };

const S = {
  vault: null, tab: LS("tab") || "home", caseId: null, homeDay: null,
  board: null, boardErr: "", boardFilter: "mine", boardQ: "",
  casesQ: "", casesFilter: "all",
  relay: qs.get("relay") || LS("relay") || "",
  roll: { no: LS("roll") || "", year: LS("rollyear") || "", cap: "", session: null, image: null, msg: "", msgKind: "", busy: false },
  courtCases: JGET("courtcases", {}),       // from "Sync from court": {CASE: {cells, headers, cino, source}}
  liveOrders: {}, details: JGET("details", {}),
  notes: Object.fromEntries(Object.entries(JGET("notes", {})).map(([k, v]) => [k, typeof v === "string" ? { t: v, at: 0 } : v])),
  synced: null,
};
const relayUrl = p => S.relay.replace(/\/+$/, "") + p;

/* ---------- dates (IST) ---------- */
const istNow = () => new Date(Date.now() + (330 + new Date().getTimezoneOffset()) * 60000);
const todayKey = () => { const d = istNow(); return `${String(d.getDate()).padStart(2,"0")}-${String(d.getMonth()+1).padStart(2,"0")}-${d.getFullYear()}`; };
const pd = s => { const [d, m, y] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const diff = s => Math.round((pd(s) - pd(todayKey())) / 864e5);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const nice = s => { const d = pd(s); return `${DOW[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`; };
const full = s => { const d = pd(s); return `${DOW[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const rel = s => { const n = diff(s); return n === 0 ? "Today" : n === 1 ? "Tomorrow" : n === 2 ? "Day after tomorrow" : n < 0 ? nice(s) : nice(s); };
const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const judgeNames = js => [...new Set(js || [])].map(j => tc(j.replace(/HON'BLE\s*/i, "")).replace(/^The Chief Justice/i, "The Chief Justice").replace(/\b([A-Z])\.(?=[A-Za-z]\.)/g, "$1.").replace(/\b([a-z])\./g, m => m.toUpperCase())).join(" & ");
const tc = s => String(s || "").toLowerCase().replace(/\b([a-z])/g, c => c.toUpperCase()).replace(/\bVs\b/g, "vs").replace(/\bU\.p\./g, "U.P.").replace(/\b(Of|And|In|The|For)\b/g, w => w.toLowerCase());
const courtLabel = c => /^C\.?J\.?$/i.test(c) ? "Chief Justice's Court" : `Court No. ${c}`;
const normCourt = c => String(c).replace(/\./g, "").toUpperCase();
const icon = {
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4M12 13v4M10 15h4"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  chev: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>',
};
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }

/* ---------- vault ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function openVault(box, pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64(box.salt), iterations: box.iter }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(box.iv) }, key, b64(box.data))));
}
async function load(pass) {
  const r = await fetch(VAULT_URL + (VAULT_URL.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
  if (r.status === 404) throw { code: "none" };
  if (!r.ok) throw { code: "net" };
  const box = await r.json();
  try { return await openVault(box, pass); } catch (e) { throw { code: "pass" }; }
}

/* ---------- sync across devices (encrypted on this device, stored in your relay) ---------- */
const noteOf = k => S.notes[k]?.t || "";
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
let store = null;   // { id, key }
async function storeInit(pass) {
  const id = hex(await crypto.subtle.digest("SHA-256", new TextEncoder().encode("vakeel-store|" + pass)));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: new TextEncoder().encode("vakeel-store-salt|" + id), iterations: 120000 },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  store = { id, key };
}
function localData() {
  const details = Object.fromEntries(Object.entries(S.details).filter(([, v]) => v?.ok));
  return { courtCases: S.courtCases, notes: S.notes, details, advname: LS("advname") || "", roll: LS("roll") || "" };
}
function mergeIn(r) {
  if (!r) return;
  S.courtCases = { ...(r.courtCases || {}), ...S.courtCases };
  for (const [k, v] of Object.entries(r.notes || {})) if (!S.notes[k] || (v.at || 0) > (S.notes[k].at || 0)) S.notes[k] = v;
  for (const [k, v] of Object.entries(r.details || {})) if (!S.details[k]?.ok) S.details[k] = v;
  if (!LS("advname") && r.advname) SET("advname", r.advname);
  if (!LS("roll") && r.roll) { SET("roll", r.roll); S.roll.no = r.roll; }
  SET("courtcases", JSON.stringify(S.courtCases)); SET("notes", JSON.stringify(S.notes));
  SET("details", JSON.stringify(Object.fromEntries(Object.entries(S.details).filter(([, v]) => v?.ok))));
}
let syncing = null, pushTimer = null;
async function syncNow() {
  if (!store || !S.relay) return;
  if (syncing) return syncing;
  syncing = (async () => {
    try {
      const g = await fetch(relayUrl("/store/" + store.id), { cache: "no-store" });
      if (g.status === 501) { S.synced = { off: true }; return; }
      if (g.ok) { const box = await g.json(); try { mergeIn(JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(box.iv) }, store.key, b64(box.data))))); } catch (e) {} }
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const data = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, store.key, new TextEncoder().encode(JSON.stringify(localData())));
      const p = await fetch(relayUrl("/store/" + store.id), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ iv: b64e(iv), data: b64e(data) }) });
      S.synced = p.ok ? { at: Date.now() } : { err: true };
    } catch (e) { S.synced = { err: true }; }
    finally { syncing = null; }
    const typing = ["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName);
    if (!typing) render();
  })();
  return syncing;
}
function schedulePush() { clearTimeout(pushTimer); pushTimer = setTimeout(syncNow, 1500); }

/* ---------- derived data ---------- */
function days() {
  const by = {};
  for (const v of Object.values(S.vault?.listings || {})) {
    if (diff(v.date) < 0) continue;
    const arr = by[v.date] ||= [];
    for (const h of v.hits) if (!arr.some(x => x.court === h.court && x.sr === h.sr && x.case === h.case)) arr.push(h);
  }
  return Object.keys(by).sort((a, b) => pd(a) - pd(b)).map(date => ({ date, hits: by[date] }));
}
const SECTION_ORDER = ["FRESH LIST", "DAILY CAUSE LIST", "FRESH MISC. APPLICATION"];
const sectionOf = h => (h.list || "").split(" — ")[0] || "OTHER";
const sectionName = s => ({ "FRESH LIST": "Fresh list", "DAILY CAUSE LIST": "Daily cause list", "FRESH MISC. APPLICATION": "Applications" }[s] || tc(s));
function courtSections(date, court) {
  for (const v of Object.values(S.vault?.listings || {})) if (v.date === date && v.sections?.[court]) return v.sections[court];
  return [];
}
const rangeText = x => x.first == null ? "" : x.first === x.last ? `item ${x.first}` : `items ${x.first}–${x.last}`;
function bySection(list) {
  const g = {};
  for (const h of list) (g[sectionOf(h)] ||= []).push(h);
  return Object.entries(g).sort((a, b) => (SECTION_ORDER.indexOf(a[0]) + 1 || 9) - (SECTION_ORDER.indexOf(b[0]) + 1 || 9) || parseFloat(a[1][0].sr) - parseFloat(b[1][0].sr));
}
function byCourt(hits) {
  const g = {};
  for (const h of hits) (g[h.court] ||= []).push(h);
  return Object.entries(g).sort((a, b) => (a[0] === "CJ" ? -1 : b[0] === "CJ" ? 1 : a[0].localeCompare(b[0], "en", { numeric: true })))
    .map(([court, list]) => ({ court, judges: list[0].judges, list: list.sort((a, b) => parseFloat(a.sr) - parseFloat(b.sr)) }));
}
function allCases() {
  const map = {};
  for (const c of Object.values(S.vault?.cases || {})) map[c.case] = { ...c, src: "list" };
  for (const [k, c] of Object.entries(S.courtCases)) map[k] = { ...(map[k] || { case: k, parties: c.parties || "", hearings: {} }), court: c, src: map[k] ? "both" : "court" };
  for (const d of days()) for (const h of d.hits) if (map[h.case]) map[h.case].next = map[h.case].next && pd(map[h.case].next.date) <= pd(d.date) ? map[h.case].next : { ...h, date: d.date };
  return Object.values(map).map(c => {
    const dates = Object.keys(c.hearings || {}).filter(d => diff(d) < 0).sort((a, b) => pd(b) - pd(a));
    return { ...c, last: dates[0] || "", orders: S.liveOrders[c.case]?.orders || c.orders || [] };
  });
}
const boardFor = c => S.board?.courts?.find(x => normCourt(x.court) === normCourt(c));

/* ---------- sharing / calendar ---------- */
const listingText = (h, date) => `${h.case} — ${tc(h.parties)}\nListed on ${full(date)} in ${courtLabel(h.court)}${h.judges?.length ? ` (${judgeNames(h.judges)})` : ""}, Item No. ${h.sr}.`;
async function share(text) {
  if (navigator.share) { try { await navigator.share({ text }); return; } catch (e) { if (e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(text); toast("Copied. Paste it in WhatsApp."); } catch (e) { window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank", "noopener"); }
}
function ics(events, name) {
  const t = s => String(s || "").replace(/[\\,;]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const body = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Vakeel Diary//EN", "CALSCALE:GREGORIAN",
    ...events.flatMap(({ h, date }) => { const d = date.split("-").reverse().join(""), n = new Date(pd(date).getTime() + 864e5);
      const e = `${n.getFullYear()}${String(n.getMonth()+1).padStart(2,"0")}${String(n.getDate()).padStart(2,"0")}`;
      return ["BEGIN:VEVENT", `UID:${h.case.replace(/\W/g, "")}-${d}@vakeel-diary`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${e}`,
        `SUMMARY:${t(`${courtLabel(h.court)} · Item ${h.sr} · ${h.case}`)}`, `DESCRIPTION:${t(listingText(h, date))}`, `LOCATION:${t("Allahabad High Court, " + courtLabel(h.court))}`,
        "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:Case listed tomorrow", "TRIGGER:-PT6H", "END:VALARM", "END:VEVENT"]; }), "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([body], { type: "text/calendar" })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- network ---------- */
async function fetchBoard() {
  if (!S.relay) return;
  try { const r = await fetch(relayUrl("/board"), { cache: "no-store" }); const j = await r.json(); if (!r.ok) throw 0; S.board = j; S.boardErr = ""; }
  catch (e) { S.boardErr = "Couldn't reach the display board. Check the relay address under More → Settings."; }
  if (["home", "board"].includes(S.tab) && !S.caseId) render();
}
async function fetchOrders(caseNo) {
  if (!S.relay || S.liveOrders[caseNo]?.loading) return;
  S.liveOrders[caseNo] = { ...(S.liveOrders[caseNo] || {}), loading: true };
  try { const r = await fetch(relayUrl("/orders?case=" + encodeURIComponent(caseNo))); const j = await r.json(); S.liveOrders[caseNo] = j.ok ? j : { error: j.error }; }
  catch (e) { S.liveOrders[caseNo] = { error: "Couldn't reach the court site." }; }
  if (S.caseId === caseNo) render();
}

/* ---------- render ---------- */
function render() {
  const v = document.getElementById("view");
  document.getElementById("tabs").hidden = !S.vault;
  const sync = document.getElementById("sync");
  if (!S.vault) { sync.innerHTML = ""; v.innerHTML = lockView(); return; }
  const stale = S.vault.updated && (Date.now() - new Date(S.vault.updated)) > 18 * 3600e3;
  sync.innerHTML = S.vault.updated ? `<span class="dot${stale ? " stale" : ""}"></span><span>Checked ${esc(ago(S.vault.updated))}</span>` : "";
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", String(b.dataset.tab === S.tab)));
  v.innerHTML = S.caseId ? caseView(S.caseId) : S.tab === "cases" ? casesView() : S.tab === "board" ? boardView() : S.tab === "more" ? moreView() : homeView();
}

function lockView() {
  return `<div class="lock">
    <svg class="mark" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#173B6C"/><g fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7.5v16M11 23.5h10M8.5 11h15"/><path d="M8.5 11l-3 6.5h6zM23.5 11l-3 6.5h6z"/></g></svg>
    <div><h1>Your cases, from tomorrow's cause list.</h1><p style="margin-top:6px">Enter your <span class="mono">VAULT_PASSPHRASE</span> to unlock this device.</p></div>
    <form id="unlock" class="card"><label class="f">Passphrase<input id="pass" type="password" autocomplete="current-password" required></label>
      <div id="lockErr"></div><button class="btn primary" type="submit">Unlock</button></form></div>`;
}

function itemRow(h, date) {
  const live = diff(date) === 0 ? boardFor(h.court) : null;
  const reached = live?.in_session && parseFloat(live.serial) >= parseFloat(h.sr);
  const sub = [`<span class="mono">${esc(h.case)}</span>`, h.application ? `Appl. ${esc(h.application)}` : "", `For ${esc(h.side)}`,
    h.list?.includes(" — ") ? esc(tc(h.list.split(" — ").pop())) : "", h.connected_with ? `with item ${esc(h.connected_with)}` : ""].filter(Boolean).join(" · ");
  return `<button class="item" data-case="${esc(h.case)}">
    <div class="no${reached ? " reached" : ""}"><small>Item</small>${esc(h.sr)}</div>
    <div class="body"><div class="pt">${esc(tc(h.parties))}</div><div class="sub">${sub}</div>
      ${h.list_type && h.list_type !== "Combined Cause List" ? `<div class="flag warn">${esc(h.list_type)}</div>` : ""}${reached ? `<div class="flag">Court has reached this item</div>` : ""}</div>
    <span class="chev">${icon.chev}</span></button>`;
}

function homeView() {
  const ds = days(), t = todayKey();
  const count = n => { const d = ds.find(x => diff(x.date) === n); return d ? d.hits.length : null; };
  const nextAfter = ds.find(d => diff(d.date) >= 2);
  const tile = (k, n, d, key) => `<button class="tile${S.homeDay === key ? " on" : ""}" data-day="${key || ""}"><span class="k">${k}</span><span class="v">${n ?? "–"}</span><span class="d">${d}</span></button>`;
  const shown = S.homeDay ? ds.filter(d => d.date === S.homeDay) : ds;
  const errs = S.vault.runs?.[0]?.errors || [];
  let h = `<div class="page-h"><div><h1>Listings</h1><div class="sub">${esc(full(t))}</div></div></div>
    <div class="tiles">${tile("Today", count(0), count(0) == null ? "Not in list" : "cases", ds.find(d => diff(d.date) === 0)?.date)}${tile("Tomorrow", count(1), count(1) == null ? "List not out yet" : "cases", ds.find(d => diff(d.date) === 1)?.date)}${tile(nextAfter ? (diff(nextAfter.date) === 2 ? "Day after" : nice(nextAfter.date)) : "Day after", nextAfter ? nextAfter.hits.length : null, nextAfter ? "cases" : "List not out yet", nextAfter?.date)}</div>`;
  if (errs.length) h += `<div class="notice" style="margin-top:14px">The last check hit a problem (${esc(errs[0])}). It retries at the next scheduled time.</div>`;
  if (!ds.length) h += `<div class="empty" style="margin-top:18px">None of your cases are in the lists published so far. The High Court usually publishes the next day's list in the evening; this checks at 7:00 pm, 9:30 pm and 7:00 am.</div>`;
  for (const d of shown) {
    h += `<section class="day"><div class="day-h"><div class="t">${esc(diff(d.date) <= 2 ? rel(d.date) : full(d.date))}<small>${diff(d.date) <= 2 ? esc(full(d.date)) + " · " : ""}${d.hits.length} case${d.hits.length === 1 ? "" : "s"}</small></div>
      <div class="btns"><button class="btn sm primary" data-pdf-day="${d.date}">${icon.doc}Share PDF</button><button class="btn sm" data-share-day="${d.date}">${icon.share}Text</button><button class="btn sm" data-ics-day="${d.date}">${icon.cal}Calendar</button></div></div>`;
    h += `<div class="listing">`;
    for (const g of byCourt(d.hits)) {
      const live = diff(d.date) === 0 ? boardFor(g.court) : null;
      const now = live ? (live.in_session ? `<span class="now">Now at item ${esc(live.serial)}</span>` : `<span class="now off">Not in session</span>`) : "";
      const tot = courtSections(d.date, g.court);
      h += `<div class="court"><div class="court-h"><div class="top"><span class="n">${esc(courtLabel(g.court))}</span>${now}</div><div class="j">${esc(judgeNames(g.judges))}</div>
        ${tot.length ? `<div class="tot">${tot.map(x => `<span><b>${esc(sectionName(x.section))}</b> ${x.count} (${esc(rangeText(x).replace("items ", "").replace("item ", ""))})</span>`).join("")}</div>` : ""}</div>
        ${bySection(g.list).map(([sec, items]) => `<div class="sec-h">${esc(sectionName(sec))}<span>${items.length} of yours</span></div>${items.map(x => itemRow(x, d.date)).join("")}`).join("")}</div>`;
    }
    h += `</div></section>`;
  }
  const checked = Object.values(S.vault.listings || {}).filter(v => diff(v.date) >= 0).map(v => `${nice(v.date)} (${v.list === "Z" ? "combined" : v.list === "U" ? "additional" : "supplementary"})`);
  if (checked.length) h += `<p class="meta" style="margin-top:20px">Lists checked: ${esc(checked.join(", "))}.</p>`;
  return h;
}

function casesView() {
  let list = allCases();
  const q = S.casesQ.trim().toUpperCase();
  if (S.casesFilter === "upcoming") list = list.filter(c => c.next);
  if (S.casesFilter === "orders") list = list.filter(c => c.orders?.length);
  if (S.casesFilter === "court") list = list.filter(c => c.src !== "list");
  if (q) list = list.filter(c => [c.case, c.parties, c.petitioner_counsel, c.respondent_counsel, noteOf(c.case), ...(c.court?.cells || [])].join(" ").toUpperCase().includes(q));
  list.sort((a, b) => (a.next ? 0 : 1) - (b.next ? 0 : 1) || (a.next && b.next ? pd(a.next.date) - pd(b.next.date) : 0) || (b.last ? pd(b.last) : 0) - (a.last ? pd(a.last) : 0) || a.case.localeCompare(b.case));
  const seg = (k, l) => `<button data-cf="${k}" aria-pressed="${S.casesFilter === k}">${l}</button>`;
  return `<div class="page-h"><div><h1>Cases</h1><div class="sub">${list.length} case${list.length === 1 ? "" : "s"}</div></div><button class="btn sm" id="exportCsv">${icon.doc}Export</button></div>
    <div class="toolbar"><input id="cq" type="search" placeholder="Search case no., party, counsel or note" value="${esc(S.casesQ)}" autocomplete="off">

/* ---------- roll sync ---------- */
const CASE_IN = /([A-Z][A-Z0-9.]*)\s*(?:NO\.?\s*)?[-\/\s]\s*(\d{1,7})\s*(?:\/|OF|-)\s*((?:19|20)\d{2})/i;
async function rollStart() {
  const R = S.roll; R.busy = true; R.msg = ""; render();
  try { const r = await fetch(relayUrl("/roll/start")); const j = await r.json(); if (!r.ok || !j.session) throw new Error(j.error || "");
    R.session = j.session; R.image = j.image; R.cap = ""; }
  catch (e) { R.msg = e.message || "Couldn't reach the court site through the relay."; R.msgKind = "bad"; }
  R.busy = false; render(); document.getElementById("rollCap")?.focus();
}
async function rollSearch() {
  const R = S.roll;
  R.no = R.no.trim().toUpperCase().replace(/\s+/g, ""); R.year = String(R.year).trim(); R.cap = R.cap.trim();
  const miss = [!R.no && "roll number", !R.year && "case year", !R.cap && "captcha"].filter(Boolean);
  if (miss.length) { R.msg = "Please fill in the " + miss.join(", ") + "."; R.msgKind = "bad"; return render(); }
  if (!/^[A-Z]{1,3}\/[A-Z]{0,3}\d{1,6}\/\d{4}$/.test(R.no)) { R.msg = "Roll number should look like A/X0000/2012."; R.msgKind = "bad"; return render(); }
  SET("roll", R.no); SET("rollyear", R.year);
  R.busy = true; render();
  try {
    const r = await fetch(relayUrl("/roll/search"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session: R.session, roll: R.no, year: R.year, captcha: R.cap }) });
    const j = await r.json();
    if (!j.ok) { R.msg = j.error || "The court didn't accept that. Load a new captcha and try again."; R.msgKind = "bad"; R.image = null; }
    else {
      let added = 0;
      for (const row of j.rows) {
        const m = row.cells.join(" ").match(CASE_IN); if (!m) continue;
        const k = `${m[1].toUpperCase()}/${m[2]}/${m[3]}`;
        if (!S.courtCases[k]) added++;
        S.courtCases[k] = { cells: row.cells, headers: j.headers, cino: row.cino, source: row.source, year: R.year, session: R.session,
          parties: row.cells.find(x => /\bVS\.?\b|\bV\/S\b/i.test(x)) || "" };
      }
      SET("courtcases", JSON.stringify(S.courtCases));
      R.msg = j.rows.length ? `${j.rows.length} cases found for ${R.year}${added ? `, ${added} new` : ""}. They're in your Cases tab. Pick another year to continue.` : (j.message || `The court returned no cases for ${R.year}.`);
      R.msgKind = j.rows.length ? "ok" : ""; R.image = null; R.lastSession = R.session; schedulePush();
    }
  } catch (e) { R.msg = "Couldn't reach the court site through the relay."; R.msgKind = "bad"; }
  R.busy = false; R.cap = ""; render();
}
async function loadDetails(id) {
  const c = S.courtCases[id]; const session = c?.session || S.roll.lastSession || "";
  S.details[id] = { loading: true }; render();
  try { const r = await fetch(relayUrl("/roll/case"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session, cino: c.cino, source: c.source }) });
    const j = await r.json(); S.details[id] = j.ok ? { ...j, at: Date.now() } : { error: j.error };
    if (j.ok) { const all = JGET("details", {}); all[id] = S.details[id]; SET("details", JSON.stringify(all)); schedulePush(); } }
  catch (e) { S.details[id] = { error: "Couldn't reach the court site." }; }
  render();
}

/* ---------- PDF of a day's list ---------- */
const PDF_LIBS = ["https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js", "https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"];
function loadScript(src) { return new Promise((ok, bad) => { const t = document.createElement("script"); t.src = src; t.onload = ok; t.onerror = bad; document.head.appendChild(t); }); }
let pdfLibs = null;
const pdfReady = () => !!(window.jspdf?.jsPDF?.API?.autoTable);
function preloadPdf() { if (!pdfLibs) pdfLibs = (async () => { for (const src of PDF_LIBS) await loadScript(src); })().catch(e => { pdfLibs = null; throw e; }); return pdfLibs; }
function buildPdf(date) {
  const day = days().find(x => x.date === date);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });
  const W = doc.internal.pageSize.getWidth(), M = 36, name = LS("advname") || "";
  const navy = [23, 59, 108], grey = [100, 116, 139];
  doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.setTextColor(14, 26, 43);
  doc.text(`Cause list · ${full(date)}`, M, 48);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...grey);
  // sections first (Fresh → Daily cause list → Applications), courts within each section
  const secs = {};
  for (const h of day.hits) (secs[sectionOf(h)] ||= []).push(h);
  const order = Object.keys(secs).sort((a, b) => (SECTION_ORDER.indexOf(a) + 1 || 9) - (SECTION_ORDER.indexOf(b) + 1 || 9));
  doc.text([name, "High Court of Judicature at Allahabad"].filter(Boolean).join("  ·  "), M, 64);
  doc.setTextColor(51, 65, 85);
  doc.text(`${day.hits.length} case${day.hits.length === 1 ? "" : "s"}:  ` + order.map(k => `${sectionName(k)} ${secs[k].length}`).join("   ·   "), M, 79);
  const H = doc.internal.pageSize.getHeight();
  const foot = () => {
    doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...grey);
    doc.text(`Vakeel Diary · from the High Court's published cause list · ${new Date().toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" })}`, M, H - 20);
    doc.text(`Page ${doc.internal.getNumberOfPages()}`, W - M, H - 20, { align: "right" });
  };
  let y = 98, n = 0;
  for (const sec of order) {
    if (y > H - 140) { doc.addPage(); y = 48; }
    // section title bar
    doc.setFillColor(...navy); doc.rect(M, y, W - 2 * M, 26, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(255, 255, 255);
    doc.text(sectionName(sec).toUpperCase(), M + 10, y + 17);
    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5);
    doc.text(`${secs[sec].length} of your case${secs[sec].length === 1 ? "" : "s"}`, W - M - 10, y + 17, { align: "right" });
    const body = [];
    for (const g of byCourt(secs[sec])) {
      const t = courtSections(date, g.court).find(x => x.section === sec);
      body.push([{ content: `${courtLabel(g.court)}${g.judges?.length ? "  —  " + judgeNames(g.judges) : ""}`, colSpan: 4,
        styles: { fillColor: [234, 240, 248], textColor: navy, fontStyle: "bold", fontSize: 9, halign: "left" } },
        { content: t ? `${t.count} in court · ${rangeText(t)}` : "", colSpan: 2,
        styles: { fillColor: [234, 240, 248], textColor: [51, 65, 85], fontSize: 8, halign: "right", overflow: "visible" } }]);
      for (const h of g.list) body.push([String(++n), h.sr, h.case + (h.application ? `\nAppl. ${h.application}` : ""), tc(h.parties),
        h.side === "petitioner" ? "Petitioner" : "Respondent",
        (h.list?.includes(" — ") ? tc(h.list.split(" — ").pop()) : "—") + (h.list_type && h.list_type !== "Combined Cause List" ? `\n(${h.list_type})` : "")]);
    }
    doc.autoTable({
      startY: y + 26, margin: { left: M, right: M, bottom: 40 },
      head: [["#", "Item", "Case No.", "Parties", "For", "Listed for"]], body,
      styles: { font: "helvetica", fontSize: 8.5, cellPadding: 5, textColor: [14, 26, 43], lineColor: [227, 232, 239], lineWidth: 0.5, valign: "top" },
      headStyles: { fillColor: [247, 248, 250], textColor: [51, 65, 85], fontStyle: "bold", fontSize: 8 },
      columnStyles: { 0: { cellWidth: 22, halign: "right", textColor: grey }, 1: { cellWidth: 36, halign: "center", fontStyle: "bold" }, 2: { cellWidth: 96, font: "courier", fontStyle: "bold" }, 4: { cellWidth: 62 }, 5: { cellWidth: 86, textColor: grey } },
      showHead: "everyPage",
      didDrawPage: foot,
    });
    y = doc.lastAutoTable.finalY + 22;
  }
  const fname = `Cause list ${date}.pdf`;
  return new File([doc.output("blob")], fname, { type: "application/pdf" });
}
// Phones only allow the share sheet straight after a tap, so the PDF is built and shared in the same tap.
// If the tools are still loading, or sharing isn't allowed, a panel offers Share / Open with a fresh tap.
function showPdfPanel(file) {
  const el = document.getElementById("pdfPanel"), url = URL.createObjectURL(file);
  const canShare = navigator.canShare && navigator.canShare({ files: [file] });
  el.innerHTML = `<div class="pp-t">${esc(file.name)} is ready</div><div class="btns">${canShare ? `<button class="btn primary" id="ppShare">${icon.share}Share</button>` : ""}
    <a class="btn${canShare ? "" : " primary"}" href="${url}" target="_blank" rel="noopener">${icon.doc}Open PDF</a><a class="btn" href="${url}" download="${esc(file.name)}">Save</a><button class="btn ghost" id="ppClose">Close</button></div>`;
  el.hidden = false; el._file = file;
}
async function shareFile(file) {
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: file.name }); document.getElementById("pdfPanel").hidden = true; return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  showPdfPanel(file);
}
async function sharePdf(date) {
  if (pdfReady()) return shareFile(buildPdf(date));        // same tap: share sheet allowed
  toast("Preparing PDF…");
  await preloadPdf();
  showPdfPanel(buildPdf(date));                             // tools just loaded: ask for one more tap
}

document.addEventListener("click", async e => {
  const b = e.target.closest("button,[data-case]"); if (!b) return;
  const d = b.dataset;
  if (d.tab) { S.tab = d.tab; S.caseId = null; SET("tab", S.tab); render(); scrollTo(0, 0); if (S.tab === "board") fetchBoard(); return; }
  if (d.case) { S.caseId = d.case; S.scrollBack = scrollY; render(); scrollTo(0, 0); return; }
  if (d.back !== undefined) { S.caseId = null; render(); scrollTo(0, S.scrollBack || 0); return; }
  if (d.day !== undefined) { S.homeDay = S.homeDay === d.day || !d.day ? null : d.day; render(); return; }
  if (d.bf) { S.boardFilter = d.bf; render(); return; }
  if (d.cf) { S.casesFilter = d.cf; render(); return; }
  if (d.pdfDay) { try { await sharePdf(d.pdfDay); } catch (err) { toast("Couldn't make the PDF. Check your connection and try again."); } return; }
  if (b.id === "ppShare") { shareFile(document.getElementById("pdfPanel")._file); return; }
  if (b.id === "ppClose") { document.getElementById("pdfPanel").hidden = true; return; }
  if (d.shareDay) { const day = days().find(x => x.date === d.shareDay); share(`My cases listed on ${full(d.shareDay)}:\n\n` + byCourt(day.hits).map(g => `${courtLabel(g.court)}\n` + g.list.map(h => `  Item ${h.sr} · ${h.case} · ${tc(h.parties)}`).join("\n")).join("\n\n")); return; }
  if (d.icsDay) { const day = days().find(x => x.date === d.icsDay); ics(day.hits.map(h => ({ h, date: d.icsDay })), `cases-${d.icsDay}.ics`); return; }
  if (d.shareCase) { const c = allCases().find(x => x.case === d.shareCase); share(`Your case ${listingText(c.next, c.next.date)}`); return; }
  if (d.icsCase) { const c = allCases().find(x => x.case === d.icsCase); ics([{ h: c.next, date: c.next.date }], `${d.icsCase.replace(/\W+/g, "-")}.ics`); return; }
  if (d.copy) { try { await navigator.clipboard.writeText(d.copy); toast("Copied " + d.copy); } catch (_) { toast(d.copy); } return; }
  if (d.details) { loadDetails(d.details); return; }
  if (b.id === "rollNew") return rollStart();
  if (b.id === "rollGo") return rollSearch();
  if (b.id === "boardRefresh") { fetchBoard(); toast("Refreshing…"); return; }
  if (b.id === "lockBtn") { SET("pass", null); S.vault = null; store = null; render(); return; }
  if (b.id === "syncBtn") { await syncNow(); toast(S.synced?.at ? "Synced" : S.synced?.off ? "Sync storage isn't set up on the relay yet." : "Couldn't sync. Check your connection."); return; }
  if (b.id === "reload") { const p = LS("pass"); try { S.vault = await load(p); toast("Results reloaded"); } catch (_) { toast("Couldn't reload. Check your connection."); } render(); return; }
  if (b.id === "exportCsv") {
    const rows = [["Case", "Parties", "Side", "Next date", "Court", "Item", "Last listed", "Orders", "Note"]].concat(allCases().map(c => [c.case, tc(c.parties), c.side || "", c.next?.date || "", c.next?.court || "", c.next?.sr || "", c.last, c.orders?.length || 0, noteOf(c.case)]));
    const csv = rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" })); a.download = "vakeel-diary-cases.csv"; document.body.appendChild(a); a.click(); a.remove(); return;
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "rollNo") S.roll.no = t.value; else if (t.id === "rollYear") S.roll.year = t.value; else if (t.id === "rollCap") S.roll.cap = t.value;
  else if (t.dataset.note) { S.notes[t.dataset.note] = { t: t.value, at: Date.now() }; SET("notes", JSON.stringify(S.notes)); schedulePush(); }
  else if (t.id === "bq" || t.id === "cq") { if (t.id === "bq") S.boardQ = t.value; else S.casesQ = t.value; const p = t.selectionStart; render(); const n = document.getElementById(t.id); n.focus(); n.setSelectionRange(p, p); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "rollCap") { e.preventDefault(); rollSearch(); } });
document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "unlock") {
    const pass = document.getElementById("pass").value, btn = e.target.querySelector("button");
    btn.disabled = true; btn.textContent = "Unlocking…";
    try { S.vault = await load(pass); SET("pass", pass); render(); fetchBoard(); preloadPdf().catch(() => {}); storeInit(pass).then(syncNow); }
    catch (err) { btn.disabled = false; btn.textContent = "Unlock";
      document.getElementById("lockErr").innerHTML = `<div class="notice bad">${err.code === "pass" ? "That passphrase doesn't match the one saved in GitHub." : err.code === "none" ? "No results yet. Run “Check cause list” once on GitHub, then try again." : "Couldn't download your results. Check your connection."}</div>`; }
  }
  if (e.target.id === "settings") { S.relay = document.getElementById("relay").value.trim(); SET("relay", S.relay || null); SET("advname", document.getElementById("advName").value.trim() || null); schedulePush(); toast("Saved"); fetchBoard(); render(); }
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncNow(); });
addEventListener("popstate", () => { if (S.caseId) { S.caseId = null; render(); } });

/* ---------- start ---------- */
(async () => {
  render();
  if (!S.relay) { try { const r = await fetch("relay.json", { cache: "no-store" }); if (r.ok) { S.relay = (await r.json()).relay || ""; if (S.relay) SET("relay", S.relay); } } catch (e) {} }
  const pass = LS("pass");
  if (pass) { try { S.vault = await load(pass); } catch (e) { if (e.code === "pass") SET("pass", null); } render(); if (S.vault) storeInit(pass).then(syncNow); }
  fetchBoard();
  setTimeout(() => { if (S.vault) preloadPdf().catch(() => {}); }, 1500);
  setInterval(() => { if (document.visibilityState === "visible" && ["home", "board"].includes(S.tab) && !S.caseId) fetchBoard(); }, 30000);
  setInterval(async () => { const p = LS("pass"); const typing = ["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName);
    if (p && document.visibilityState === "visible" && !typing) { try { S.vault = await load(p); render(); } catch (e) {} } }, 10 * 60000);
})();
})();
</script>
</body>
